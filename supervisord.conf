~[supervisord]
nodaemon=true
user=root
loglevel=info
logfile=/var/log/supervisord.log

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1920x1080x24
autorestart=true
priority=100

[program:x11vnc]
command=/usr/bin/x11vnc -display :1 -nopw -forever -shared -scale 1.0
autorestart=true
priority=200

[program:websockify]
command=/usr/share/novnc/utils/websockify/run 6080 localhost:5900 --web /usr/share/novnc
autorestart=true
priority=300

[program:fluxbox]
command=/usr/bin/fluxbox
environment=DISPLAY=:1
autorestart=true
priority=400
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:hdemg-app]
command=/usr/local/bin/python /app/src/main.py
environment=DISPLAY=:1,HOME=/app,PYTHONUNBUFFERED=1,QT_X11_NO_MITSHM=1,QT_QPA_PLATFORM=xcb,XDG_RUNTIME_DIR=/tmp,MPLBACKEND=Qt5Agg
autorestart=true
priority=500
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:xfce4-panel]
command=/usr/bin/xfce4-panel
environment=DISPLAY=:1,HOME=/app