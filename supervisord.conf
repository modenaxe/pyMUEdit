[supervisord]
nodaemon=true
user=root
loglevel=info
logfile=/var/log/supervisord.log

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1920x1080x24
autorestart=true
priority=100

[program:x11vnc]
command=/usr/bin/x11vnc -display :1 -nopw -forever -shared -scale 1.0
autorestart=true
priority=200

[program:websockify]
command=/usr/share/novnc/utils/websockify/run 6080 localhost:5900 --web /usr/share/novnc
autorestart=true
priority=300

[program:xfce4-session]
command=/usr/bin/dbus-launch --exit-with-session xfce4-session
environment=DISPLAY=:1,HOME=/app
autorestart=true
priority=400

[program:xfce4-panel]
command=/usr/bin/xfce4-panel
environment=DISPLAY=:1,HOME=/app
autorestart=true
priority=410
