services:
  hdemg-app:
    build: .
    image: hdemg-analysis-tool
    container_name: hdemg-analysis-tool
    ports:
      - "5900:5900" # VNC port
      - "6080:6080" # noVNC web access port
    volumes:
      - ./data:/app/data # Mount data directory for persistent storage
      - ./src:/app/src
    environment:
      - DISPLAY=:1
      - HOME=/app
      - PYTHONUNBUFFERED=1
      - QT_X11_NO_MITSHM=1
      - QT_QPA_PLATFORM=xcb
      - XDG_RUNTIME_DIR=/tmp
      - MPLBACKEND=Qt5Agg
    restart: unless-stopped
