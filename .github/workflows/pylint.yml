name: Code Quality Check

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pyqt5 python3-pyqt5.qtsvg xvfb

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint autopep8 black isort
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Create .pylintrc configuration
      run: |
        cat > .pylintrc << 'EOF'
        [MAIN]
        init-hook='import sys; sys.path.append("src")'
        jobs=0

        [MESSAGES CONTROL]
        disable=
            missing-docstring,
            too-many-arguments,
            too-many-locals,
            too-many-instance-attributes,
            too-few-public-methods,
            import-error,
            no-name-in-module,
            unused-import,
            invalid-name,
            duplicate-code,
            unused-argument,
            attribute-defined-outside-init,
            super-init-not-called

        [FORMAT]
        max-line-length=100

        [DESIGN]
        max-args=10
        max-locals=25
        max-attributes=20
        max-public-methods=30
        max-statements=75
        EOF

    - name: Auto-fix code formatting
      run: |
        # Fix import order
        isort src/ui/ --recursive
        # Fix PEP8 issues (indentation, whitespace, etc.)
        autopep8 --in-place --aggressive --aggressive --recursive src/ui/
        # Format code with Black (optional, more opinionated)
        # black src/ui/

    - name: Commit auto-fixes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add src/ui/
        git diff --staged --quiet || git commit -m "Auto-fix linting issues [skip ci]"
        git push || echo "No changes to push"

    - name: Run Pylint on UI folder
      run: |
        xvfb-run -a pylint src/ui/ --recursive=y --score=yes --fail-under=7.0
